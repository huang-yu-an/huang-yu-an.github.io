<h1>论文发表</h1>
<p>下面是完整的论文列表（共 122 篇），按发表年份倒序排列。支持搜索、按类型或会议/期刊筛选，以及排序。<br><strong>加粗</strong>作者为本人的姓名。</p>
<div id="pub-target"></div>
<script src="../assets/js/bibtex.js"></script>
<script>
  BibTeX.renderPublications({
    bibPath: '../publications.bib',
    target: document.getElementById('pub-target'),
    labels: {
      search: '搜索关键词…',
      type: '类型',
      allTypes: '全部类型',
      allVenues: '全部期刊/会议',
      sort: '排序',
      newest: '最新优先',
      oldest: '最早优先',
      countLabel: function(n) { return n + ' 篇论文'; },
      loading: '正在加载论文列表…',
      empty: '没有匹配的论文',
      stats: {
        papers: '论文',
        firstAuthor: '第一作者',
        coAuthor: '合著论文',
        venues: '期刊/会议'
      },
      yearHeading: function(y) { return y; },
      noYear: '未标年份',
      ownerName: 'huang, yu-an'
    }
  });
</script>
