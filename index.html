<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yu-An Huang · 黄裕安</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <style>
    .lang-picker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      max-width: 760px;
      margin: 4rem auto;
      padding: 0 24px;
    }
    .lang-card {
      background: var(--c-bg-card);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      text-align: center;
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .lang-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--c-accent);
    }
    .lang-card .label {
      font-size: 2rem;
      font-weight: 700;
      color: var(--c-text);
      margin-bottom: .3em;
    }
    .lang-card .sub {
      color: var(--c-text-muted);
      font-size: 0.95rem;
    }
    .lang-card .lang {
      display: inline-block;
      padding: 4px 12px;
      background: var(--c-accent-soft);
      color: var(--c-accent);
      border-radius: 999px;
      font-size: 0.85rem;
      margin-top: 1rem;
      font-weight: 500;
    }
    .lang-card a { border-bottom: none; display: block; color: inherit; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav-brand" href="./">Yu-An Huang · 黄裕安</a>
    </nav>
  </header>
  <main>
    <div class="lang-picker">
      <div class="lang-card">
        <a href="./zh/">
          <div class="label">中文</div>
          <div class="sub">个人学术主页</div>
          <span class="lang">进入 →</span>
        </a>
      </div>
      <div class="lang-card">
        <a href="./en/">
          <div class="label">English</div>
          <div class="sub">Personal Academic Site</div>
          <span class="lang">Enter →</span>
        </a>
      </div>
    </div>
    <p style="text-align:center;color:var(--c-text-muted);font-size:.85rem;">
      Or jump directly to <a href="https://yu-anhuang.github.io/">https://yu-anhuang.github.io</a>
    </p>
  </main>
  <footer class="site-footer">
    <p>© 2026 Yu-An Huang · School of Computer Science, NWPU</p>
  </footer>
</body>
</html>
